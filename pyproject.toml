[project]
name = "jlcpick"
version = "0.2.0"
description = "Look up JLCPCB parts and audit KiCad boards for JLCPCB assembly"
readme = "README.md"
authors = [
    { name = "PedroDeSanti", email = "phmartinsanti@gmail.com" }
]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later AND GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/GPL-3.0.txt"]
dependencies = [
    "easyeda2kicad==1.0.1",
]

[project.optional-dependencies]
fab = ["kikit==1.8.1"]

[project.scripts]
jlcpick = "jlcpick.cli:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "xlrd>=2.0.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kicad-plugin", "kicad-plugin/plugins"]
addopts = ["-m", "not live and not kicad", "--strict-markers"]
markers = [
    "live: hits the real JLCPCB and EasyEDA endpoints",
    "kicad: runs KiKit, so needs jlcpick[fab] in a Python that imports KiCad's pcbnew",
]

[tool.ty.environment]
extra-paths = ["kicad-plugin", "kicad-plugin/plugins"]

[tool.ty.analysis]
allowed-unresolved-imports = ["wx", "wx.**", "kipy", "kipy.**"]
